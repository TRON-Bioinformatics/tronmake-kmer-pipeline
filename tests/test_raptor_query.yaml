- name: raptor_query
  tags:
    - raptor
    - query
  command: >
    snakemake -p --configfile tests/configs/query.yaml --config query='{method':' raptor, index':' tests/index_manifest/raptor_index_manifest.yaml}'
  files:
    - path: "query/raptor/raptor_test_index/search.tsv"
      md5sum: "0a2be9a77f91645ce9ff8287115627f7"
      contains:
        - "## Percentage threshold = 0.7"
        - "1_1/1	50"
    - path: "query/raptor/raptor_test_index/parsed_search.tsv.gz"
      md5sum: "c7e3b1f5efc1628e6af9dcc5c60e1960"
    - path: "query/raptor/search.parquet"
      md5sum: "7e050f83d188f2a0970875e77c9c4ded"

