- name: raptor_query
  command: >
    snakemake -p --configfile tests/configs/query.yaml --config query='{method':' raptor, index':' tests/configs/raptor_index.yaml}'
  files:
    - path: "query/raptor/raptor_test_index/search.txt"
      md5sum: "259f242f2f08118151eb88b7c0735dde"
      contains:
        - "## Percentage threshold = 0.7"
        - "1_1/1	50"
