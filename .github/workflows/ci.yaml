name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  syntaxcheck:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - run: |
          pixi run test-syntax

  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
      - run: |
          pixi run lint


  integration:
    name: Integration Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pipeline:
              - '!**.md'
              - '!docs/**'
              - '!documentation/**'
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
    
      - name: Run Integration Tests
        shell: bash -l {0}
        run: |
          pixi run test-ci

      - name: Clean up
        run: |
          rm -rf .snakemake
          rm -rf results
      - run: df -h
        if: ${{ always() }}
